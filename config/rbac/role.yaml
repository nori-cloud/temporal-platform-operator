# yamllint disable-file
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - temporal.io
  resources:
  - connections
  - workerdeployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - temporal.io
  resources:
  - workerdeployments/status
  verbs:
  - get
- apiGroups:
  - temporal.nori-cloud.io
  resources:
  - temporalnamespaces
  - temporalworkers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - temporal.nori-cloud.io
  resources:
  - temporalnamespaces/finalizers
  - temporalworkers/finalizers
  verbs:
  - update
- apiGroups:
  - temporal.nori-cloud.io
  resources:
  - temporalnamespaces/status
  - temporalworkers/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - temporal.nori-cloud.io
  resources:
  - temporalproxies
  verbs:
  - get
  - list
  - watch
