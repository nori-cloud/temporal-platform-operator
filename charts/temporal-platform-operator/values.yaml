# Namespace in which the operator controllers are installed.
namespace: temporal

replicaCount: 1

image:
  repository: ghcr.io/nori-cloud/temporal-platform-operator
  tag: 42b398ae9b63382eaa6558c4ed4e013a82b3bcfd
  pullPolicy: IfNotPresent
  pullSecrets: []

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

# The address used by the controllers to reach the Temporal frontend.
temporal:
  frontendAddress: temporal-frontend.temporal.svc.cluster.local:7233

controllers:
  namespace:
    enabled: true
    replicaCount: 1
  worker:
    enabled: true
    replicaCount: 1

# Values for the OCI temporal-worker-controller dependency.
temporal-worker-controller:
  image:
    tag: v1.11.0
  rbac:
    restrictWatchNamespaces: []
    createEndUserRoles: false
  certmanager:
    install: false
    enabled: true

# The CRD-only dependency has no configurable values.
temporal-worker-controller-crds: {}
