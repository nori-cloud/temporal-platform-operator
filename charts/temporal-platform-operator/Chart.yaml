apiVersion: v2
name: temporal-platform-operator
description: The Temporal platform operator and its default Temporal proxy
type: application
version: 0.1.2
appVersion: "0.1.2"

# The worker controller is intentionally consumed as a dependency rather than
# copied into this chart. The CRD chart is kept separate so Helm can install
# those CRDs before the controller.
dependencies:
  - name: temporal-worker-controller-crds
    version: 0.29.1
    repository: oci://docker.io/temporalio
  - name: temporal-worker-controller
    version: 0.29.1
    repository: oci://docker.io/temporalio
