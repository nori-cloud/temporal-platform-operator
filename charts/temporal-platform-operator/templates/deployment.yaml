apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "temporal-platform-operator.fullname" . }}
  namespace: {{ include "temporal-platform-operator.namespace" . }}
  labels:
    {{- include "temporal-platform-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "temporal-platform-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "temporal-platform-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "temporal-platform-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          env:
            - name: TEMPORAL_FRONTEND_ADDRESS
              value: {{ .Values.temporal.frontendAddress | quote }}
          args:
            - --leader-elect
            - --metrics-bind-address=:8443
            - --metrics-secure=true
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
