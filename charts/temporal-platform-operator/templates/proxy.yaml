apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-proxy-config
  namespace: {{ include "temporal-platform-operator.namespace" . }}
  labels:
    helm.sh/chart: {{ include "temporal-platform-operator.chart" . }}
    app.kubernetes.io/name: temporal-proxy
    app.kubernetes.io/instance: default
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  config.yaml: |
    hostPort: 0.0.0.0:7233
    upstreams:
      - name: temporal
        hostPort: {{ .Values.temporal.frontendAddress | quote }}
        insecure: true
    routing:
      default: temporal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-proxy
  namespace: {{ include "temporal-platform-operator.namespace" . }}
  labels:
    helm.sh/chart: {{ include "temporal-platform-operator.chart" . }}
    app.kubernetes.io/name: temporal-proxy
    app.kubernetes.io/instance: default
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.proxy.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-proxy
      app.kubernetes.io/instance: default
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-proxy
        app.kubernetes.io/instance: default
        app.kubernetes.io/component: proxy
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          args:
            - serve
            - --config=/etc/proxy/config.yaml
          ports:
            - name: temporal
              containerPort: 7233
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/proxy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: temporal-proxy-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-proxy
  namespace: {{ include "temporal-platform-operator.namespace" . }}
  labels:
    helm.sh/chart: {{ include "temporal-platform-operator.chart" . }}
    app.kubernetes.io/name: temporal-proxy
    app.kubernetes.io/instance: default
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: proxy
spec:
  type: {{ .Values.proxy.service.type }}
  ports:
    - name: temporal
      port: {{ .Values.proxy.service.port }}
      targetPort: temporal
      protocol: TCP
  selector:
    app.kubernetes.io/name: temporal-proxy
    app.kubernetes.io/instance: default
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-proxy
  namespace: {{ include "temporal-platform-operator.namespace" . }}
  labels:
    helm.sh/chart: {{ include "temporal-platform-operator.chart" . }}
    app.kubernetes.io/name: temporal-proxy
    app.kubernetes.io/instance: default
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal-proxy
      app.kubernetes.io/instance: default
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - name: temporal
          port: 7233
          protocol: TCP
  egress:
    - {}
---
apiVersion: temporal.nori-cloud.io/v1alpha1
kind: TemporalProxy
metadata:
  name: default
  namespace: {{ include "temporal-platform-operator.namespace" . }}
  labels:
    {{- include "temporal-platform-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-proxy
spec:
  routePolicy: AllNamespaces
