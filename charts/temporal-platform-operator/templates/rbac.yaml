apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "temporal-platform-operator.fullname" . }}-manager
  labels:
    {{- include "temporal-platform-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - temporal.io
    resources:
      - workerdeployments
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups:
      - temporal.nori-cloud.io
    resources:
      - temporalnamespaces
      - temporalproxies
      - temporalworkers
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups:
      - temporal.nori-cloud.io
    resources:
      - temporalnamespaces/finalizers
      - temporalproxies/finalizers
      - temporalworkers/finalizers
    verbs: [update]
  - apiGroups:
      - temporal.nori-cloud.io
    resources:
      - temporalnamespaces/status
      - temporalproxies/status
      - temporalworkers/status
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "temporal-platform-operator.fullname" . }}-manager
  labels:
    {{- include "temporal-platform-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "temporal-platform-operator.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "temporal-platform-operator.serviceAccountName" . }}
    namespace: {{ include "temporal-platform-operator.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "temporal-platform-operator.fullname" . }}-leader-election
  namespace: {{ include "temporal-platform-operator.namespace" . }}
  labels:
    {{- include "temporal-platform-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps, events]
    verbs: [create, get, list, patch, update, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "temporal-platform-operator.fullname" . }}-leader-election
  namespace: {{ include "temporal-platform-operator.namespace" . }}
  labels:
    {{- include "temporal-platform-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "temporal-platform-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "temporal-platform-operator.serviceAccountName" . }}
    namespace: {{ include "temporal-platform-operator.namespace" . }}
