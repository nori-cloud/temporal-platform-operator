{{- range $name, $controller := .Values.controllers }}
{{- if $controller.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "temporal-platform-operator.fullname" $ }}-{{ $name }}
  labels:
    {{- include "temporal-platform-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-controller
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch, update]
{{- if eq $name "namespace" }}
  - apiGroups: [temporal.nori-cloud.io]
    resources: [temporalnamespaces]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [temporal.nori-cloud.io]
    resources: [temporalnamespaces/status]
    verbs: [get, update, patch]
  - apiGroups: [temporal.nori-cloud.io]
    resources: [temporalnamespaces/finalizers]
    verbs: [update]
{{- else if eq $name "worker" }}
  - apiGroups: [temporal.nori-cloud.io]
    resources: [temporalworkers]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [temporal.nori-cloud.io]
    resources: [temporalworkers/status]
    verbs: [get, update, patch]
  - apiGroups: [temporal.nori-cloud.io]
    resources: [temporalworkers/finalizers]
    verbs: [update]
  - apiGroups: [temporal.nori-cloud.io]
    resources: [temporalnamespaces]
    verbs: [get, list, watch]
  - apiGroups: [temporal.io]
    resources: [connections, workerdeployments]
    verbs: [create, delete, get, list, patch, update, watch]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "temporal-platform-operator.fullname" $ }}-{{ $name }}
  labels:
    {{- include "temporal-platform-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "temporal-platform-operator.fullname" $ }}-{{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "temporal-platform-operator.fullname" $ }}-{{ $name }}
    namespace: {{ include "temporal-platform-operator.namespace" $ }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "temporal-platform-operator.fullname" $ }}-{{ $name }}-leader-election
  namespace: {{ include "temporal-platform-operator.namespace" $ }}
  labels:
    {{- include "temporal-platform-operator.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps, events]
    verbs: [create, get, list, patch, update, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "temporal-platform-operator.fullname" $ }}-{{ $name }}-leader-election
  namespace: {{ include "temporal-platform-operator.namespace" $ }}
  labels:
    {{- include "temporal-platform-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "temporal-platform-operator.fullname" $ }}-{{ $name }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "temporal-platform-operator.fullname" $ }}-{{ $name }}
    namespace: {{ include "temporal-platform-operator.namespace" $ }}
---
{{- end }}
{{- end }}
